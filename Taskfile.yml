# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

tasks:
  build-jar:
    desc: Build a fat JAR ready to run
    dir: javalin
    cmd: ./mvnw clean package -DskipTests
  
  build-native:
    desc: Build a binary-native image
    dir: javalin
    cmd: time ./mvnw -Pnative package

  run-dev:
    desc: Run the app in dev mode
    deps: [db-up]
    dir: javalin
    cmd: |
      ./mvnw clean package -DskipTests && \
      doppler run --project order-ecommerce --config dev -- bash -c '
        export ORDER_DB_URL="jdbc:postgresql://localhost:5432/$DB_NAME" && \
        export ORDER_DB_USER="$DB_USER" && \
        export ORDER_DB_PASSWORD="$DB_PASS" && \
        export ORDER_DB_MAX_POOL_SIZE="$DB_MAX_POOL_SIZE" && \
        export ORDER_DB_POOL_NAME="$DB_POOL_NAME" && \
        java -Dorg.slf4j.simpleLogger.log.com.thermcampos="info" \
          -jar target/javalin-1.0-SNAPSHOT.jar
      '

  run-native-tracing:
    desc: Buidl and run with native agent to trace reflections
    deps: [db-up]
    dir: javalin
    cmds:
      - |
        ./mvnw clean package -DskipTests && \
        doppler run --project order-ecommerce --config dev -- bash -c '
          export ORDER_DB_URL="jdbc:postgresql://localhost:5432/$DB_NAME" && \
          export ORDER_DB_USER="$DB_USER" && \
          export ORDER_DB_PASSWORD="$DB_PASS" && \
          export ORDER_DB_MAX_POOL_SIZE="$DB_MAX_POOL_SIZE" && \
          export ORDER_DB_POOL_NAME="$DB_POOL_NAME" && \
          java -agentlib:native-image-agent=config-output-dir=src/main/resources/META-INF/native-image \
            -jar target/javalin-1.0-SNAPSHOT.jar
        '
  run-native:
    desc: Run the native binary
    deps: [db-up]
    dir: javalin
    cmd: |
      doppler run --project order-ecommerce --config dev -- bash -c '
        export ORDER_DB_URL="jdbc:postgresql://localhost:5432/$DB_NAME" && \
        export ORDER_DB_USER="$DB_USER" && \
        export ORDER_DB_PASSWORD="$DB_PASS" && \
        export ORDER_DB_MAX_POOL_SIZE="$DB_MAX_POOL_SIZE" && \
        export ORDER_DB_POOL_NAME="$DB_POOL_NAME" && \
        export ORDER_DB_MIGRATIONS_PATH="db/migration" && \
        ./target/app-native -Dorg.slf4j.simpleLogger.log.com.thermcampos="info"
      '

  run-jar:
    desc: Run the jar app with JVM
    deps: [db-up]
    dir: javalin
    cmd: |
      doppler run --project order-ecommerce --config dev -- bash -c '
        export ORDER_DB_URL="jdbc:postgresql://localhost:5432/$DB_NAME" && \
        export ORDER_DB_USER="$DB_USER" && \
        export ORDER_DB_PASSWORD="$DB_PASS" && \
        export ORDER_DB_MAX_POOL_SIZE="$DB_MAX_POOL_SIZE" && \
        export ORDER_DB_POOL_NAME="$DB_POOL_NAME" && \
        java -Dorg.slf4j.simpleLogger.log.com.thermcampos="info" \
          -jar target/javalin-1.0-SNAPSHOT.jar
      '
  test:
    desc: Run tests
    dir: javalin
    cmd: ./mvnw test

  db-up:
    desc: Starts the database using Docker
    cmd: doppler run --config dev -- docker compose up -d

  db-down:
    desc: Stops the database using Docker
    cmd: doppler run --config dev -- docker compose down

